name: Build and Release iOS

on:
  push:
    branches:
      - trae
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ios-build:
    name: "Build iOS IPA"
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: trae

      - name: Setup Python 2.7
        run: |
          brew install pyenv
          pyenv install 2.7.18
          pyenv global 2.7.18
          echo "$HOME/.pyenv/shims" >> $GITHUB_PATH

      - name: Cache cocos2d-x
        id: cache-cocos
        uses: actions/cache@v4
        with:
          path: cocos2d-x
          key: cocos2d-x-3.6-full-v1

      - name: Clone and setup cocos2d-x 3.6
        if: steps.cache-cocos.outputs.cache-hit != 'true'
        run: |
          git clone --depth=1 --branch=cocos2d-x-3.6 https://github.com/cocos2d/cocos2d-x.git
          cd cocos2d-x
          git config --global url."https://github.com/".insteadOf "git://github.com/"
          yes no | python download-deps.py
          git submodule update --init --recursive

      - name: Setup cocos environment
        run: |
          echo "COCOS_CONSOLE_ROOT=$GITHUB_WORKSPACE/cocos2d-x/tools/cocos2d-console/bin" >> $GITHUB_ENV
          echo "COCOS_TEMPLATES_ROOT=$GITHUB_WORKSPACE/cocos2d-x/templates" >> $GITHUB_ENV
          echo "COCOS_X_ROOT=$GITHUB_WORKSPACE/cocos2d-x" >> $GITHUB_ENV

      - name: Create iOS project from template
        run: |
          python $COCOS_CONSOLE_ROOT/cocos new Kirikiroid2 -p org.tvp.kirikiri2 -l cpp -d build

      - name: Copy source files
        run: |
          DEST=build/Kirikiroid2/Classes
          rm -rf $DEST/*
          mkdir -p $DEST

          cp -r src/core/base $DEST/base
          cp -r src/core/environ $DEST/environ
          cp -r src/core/extension $DEST/extension
          cp -r src/core/movie $DEST/movie
          cp -r src/core/msg $DEST/msg
          cp -r src/core/sound $DEST/sound
          cp -r src/core/tjs2 $DEST/tjs2
          cp -r src/core/utils $DEST/utils
          cp -r src/core/visual $DEST/visual
          cp -r src/plugins $DEST/plugins

          cp src/core/environ/ios/iOSUtils.mm $DEST/environ/ios/

      - name: Copy resources
        run: |
          cp -r cocos/kr2/Resources/* build/Kirikiroid2/Resources/
          cp -r cocos/kr2/cocosstudio/* build/Kirikiroid2/Resources/

      - name: Install mod-pbxproj
        run: pip3 install mod-pbxproj

      - name: Add source files to Xcode project
        run: |
          python3 scripts/add_sources.py \
            build/Kirikiroid2/proj.ios_mac/Kirikiroid2.xcodeproj/project.pbxproj \
            build/Kirikiroid2/Classes/

      - name: Build IPA (unsigned)
        run: |
          cd build/Kirikiroid2/proj.ios_mac
          xcodebuild \
            -project Kirikiroid2.xcodeproj \
            -scheme Kirikiroid2 \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/Kirikiroid2.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY='' \
            ENABLE_BITCODE=NO \
            2>&1 | tee xcodebuild.log | tail -100

      - name: Package IPA
        run: |
          APP_PATH=$(find build/Kirikiroid2 -name "*.app" -type d | head -1)
          if [ -n "$APP_PATH" ]; then
            mkdir -p Payload
            cp -r "$APP_PATH" Payload/
            zip -r Kirikiroid2.ipa Payload/
            echo "IPA created successfully"
          else
            echo "No .app found, checking archive..."
            ARCHIVE_APP=$(find build/Kirikiroid2 -path "*/Products/Applications/*.app" -type d | head -1)
            if [ -n "$ARCHIVE_APP" ]; then
              mkdir -p Payload
              cp -r "$ARCHIVE_APP" Payload/
              zip -r Kirikiroid2.ipa Payload/
              echo "IPA created from archive"
            else
              echo "ERROR: No .app found"
              cat build/Kirikiroid2/proj.ios_mac/xcodebuild.log | grep -i error | head -30
              exit 1
            fi
          fi

      - name: Upload Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: "ios-build-${{ github.sha }}"
          files: Kirikiroid2.ipa
          name: "Kirikiroid2 iOS Build"
          body: |
            iOS build with popup crash fix

            Changes:
            - Added iOS native popup implementation (UIAlertController)
            - Fixed memory management for ARC compatibility
            - Added thread safety for UI operations
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
