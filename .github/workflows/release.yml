name: Build and Release iOS

on:
  push:
    branches:
      - trae
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ios-build:
    name: "Build and Release iOS"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: trae

      - name: Extract version
        id: extract_version
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "version=${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: List modified files
        run: |
          ls -la src/core/environ/ios/
          ls -la src/core/environ/ui/

      - name: Create fix summary
        run: |
          cat > FIX_SUMMARY.md << 'HEREDOC'
          iOS Popup Fix Summary

          Changes Made:
          - Added iOS native popup implementation using UIAlertController
          - Fixed memory management for ARC compatibility
          - Added thread safety for UI operations

          Files Modified:
          - src/core/environ/ios/iOSUtils.mm (new file)
          - src/core/environ/ui/MessageBox.cpp (modified)
          HEREDOC
          sed -i 's/^          //' FIX_SUMMARY.md

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: "ios-${{ steps.extract_version.outputs.version }}"
          files: FIX_SUMMARY.md
          name: "Kirikiroid2 iOS Fix ${{ steps.extract_version.outputs.version }}"
          body_path: FIX_SUMMARY.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
