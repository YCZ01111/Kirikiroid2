name: Build and Release iOS

on:
  push:
    branches:
      - trae
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ios-build:
    name: "Build iOS IPA"
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: trae

      - name: Setup Python 2.7
        run: |
          brew install pyenv
          pyenv install 2.7.18
          pyenv global 2.7.18
          echo "$HOME/.pyenv/shims" >> $GITHUB_PATH

      - name: Cache cocos2d-x
        id: cache-cocos
        uses: actions/cache@v4
        with:
          path: cocos2d-x
          key: cocos2d-x-3.6-full-v4

      - name: Clone and setup cocos2d-x 3.6
        if: steps.cache-cocos.outputs.cache-hit != 'true'
        run: |
          git clone --depth=1 --branch=cocos2d-x-3.6 https://github.com/cocos2d/cocos2d-x.git
          cd cocos2d-x
          git config --global url."https://github.com/".insteadOf "git://github.com/"
          # Download 3rd-party dependencies by cloning the 3rd-party-libs-bin repo
          echo "Cloning 3rd-party dependencies (v3-deps-47)..."
          git clone --depth=1 --branch=v3-deps-47 https://github.com/cocos2d/cocos2d-x-3rd-party-libs-bin.git /tmp/3rd-party-deps
          # Merge external dependencies into cocos2d-x/external/
          echo "Merging external dependencies..."
          mkdir -p external
          rsync -a /tmp/3rd-party-deps/ external/
          rm -rf /tmp/3rd-party-deps
          # Move fbx-conv to tools directory (as specified in config.json)
          if [ -d "external/fbx-conv" ]; then
            mkdir -p tools
            mv external/fbx-conv tools/
          fi
          git submodule update --init --recursive || echo "submodule update failed, continuing..."
          echo "cocos2d-x setup completed"
          # Verify critical files exist
          echo "Checking external files..."
          ls -la external/unzip/unzip.cpp external/xxhash/xxhash.c || { echo "ERROR: Critical external files are missing!"; exit 1; }

      - name: Setup cocos environment
        run: |
          echo "COCOS_CONSOLE_ROOT=$GITHUB_WORKSPACE/cocos2d-x/tools/cocos2d-console/bin" >> $GITHUB_ENV
          echo "COCOS_TEMPLATES_ROOT=$GITHUB_WORKSPACE/cocos2d-x/templates" >> $GITHUB_ENV
          echo "COCOS_X_ROOT=$GITHUB_WORKSPACE/cocos2d-x" >> $GITHUB_ENV

      - name: Create iOS project from template
        run: |
          bash $COCOS_CONSOLE_ROOT/cocos new Kirikiroid2 -p org.tvp.kirikiri2 -l cpp -d build

      - name: Patch cocos2d-x for Xcode 15 compatibility
        run: bash scripts/patch_cocos2d.sh build/Kirikiroid2

      - name: Verify patch applied
        run: |
          FILE="build/Kirikiroid2/cocos2d/cocos/base/CCController-iOS.mm"
          if grep -q "GameController" "$FILE"; then
            echo "ERROR: Patch was not applied - GameController still present"
            exit 1
          fi
          echo "Patch verified - no GameController import found"

      - name: Download Oniguruma
        run: |
          git clone --depth=1 --branch=v5.9.6 https://github.com/kkos/oniguruma.git vendor/onig

      - name: Copy source files
        run: |
          DEST=build/Kirikiroid2/Classes
          rm -rf $DEST/*
          mkdir -p $DEST

          cp -r src/core/base $DEST/base
          rm -f $DEST/base/win32/FuncStubs.cpp $DEST/base/win32/SusieArchive.cpp

          cp -r src/core/environ $DEST/environ
          rm -rf $DEST/environ/android $DEST/environ/sdl
          rm -f $DEST/environ/MainFormUnit.cpp

          cp -r src/core/extension $DEST/extension
          cp -r src/core/movie $DEST/movie

          cp -r src/core/msg $DEST/msg

          cp -r src/core/sound $DEST/sound
          rm -rf $DEST/sound/ARM
          rm -f $DEST/sound/xmmlib.cpp $DEST/sound/WaveFormatConverter_SSE.cpp

          cp -r src/core/tjs2 $DEST/tjs2

          cp -r src/core/utils $DEST/utils

          cp -r src/core/visual $DEST/visual
          rm -rf $DEST/visual/ARM
          rm -f $DEST/visual/Resampler.cpp
          rm -f $DEST/visual/win32/GDIFontRasterizer.cpp
          rm -f $DEST/visual/win32/NativeFreeTypeFace.cpp
          rm -f $DEST/visual/win32/TVPSysFont.cpp
          rm -f $DEST/visual/win32/VSyncTimingThread.cpp

          cp -r src/plugins $DEST/plugins

          cp src/core/environ/ios/iOSUtils.mm $DEST/environ/ios/

          mkdir -p $DEST/vendor/onig/enc
          cp vendor/onig/regcomp.c vendor/onig/regexec.c vendor/onig/regparse.c vendor/onig/regenc.c \
             vendor/onig/regerror.c vendor/onig/regext.c vendor/onig/reggnu.c vendor/onig/regsyntax.c \
             vendor/onig/regtrav.c vendor/onig/regversion.c vendor/onig/st.c vendor/onig/regposix.c \
             vendor/onig/regposerr.c $DEST/vendor/onig/
          cp vendor/onig/oniguruma.h vendor/onig/oniggnu.h vendor/onig/onigposix.h \
             vendor/onig/regint.h vendor/onig/regparse.h vendor/onig/regenc.h vendor/onig/st.h \
             vendor/onig/config.h $DEST/vendor/onig/ 2>/dev/null || true
          cp vendor/onig/enc/unicode.c vendor/onig/enc/ascii.c vendor/onig/enc/utf8.c \
             vendor/onig/enc/utf16_be.c vendor/onig/enc/utf16_le.c \
             vendor/onig/enc/utf32_be.c vendor/onig/enc/utf32_le.c \
             vendor/onig/enc/euc_jp.c vendor/onig/enc/sjis.c vendor/onig/enc/iso8859_1.c \
             vendor/onig/enc/iso8859_2.c vendor/onig/enc/iso8859_3.c vendor/onig/enc/iso8859_4.c \
             vendor/onig/enc/iso8859_5.c vendor/onig/enc/iso8859_6.c vendor/onig/enc/iso8859_7.c \
             vendor/onig/enc/iso8859_8.c vendor/onig/enc/iso8859_9.c \
             vendor/onig/enc/iso8859_10.c vendor/onig/enc/iso8859_11.c \
             vendor/onig/enc/iso8859_13.c vendor/onig/enc/iso8859_14.c \
             vendor/onig/enc/iso8859_15.c vendor/onig/enc/iso8859_16.c \
             vendor/onig/enc/euc_tw.c vendor/onig/enc/euc_kr.c vendor/onig/enc/big5.c \
             vendor/onig/enc/gb18030.c vendor/onig/enc/koi8_r.c vendor/onig/enc/cp1251.c \
             $DEST/vendor/onig/enc/

      - name: Copy resources
        run: |
          cp -r cocos/kr2/Resources/* build/Kirikiroid2/Resources/
          cp -r cocos/kr2/cocosstudio/* build/Kirikiroid2/Resources/

      - name: Patch Oniguruma for C99 compatibility
        run: |
          cd build/Kirikiroid2/Classes/vendor/onig
          # Oniguruma v5.9.6 C files need explicit #include <stdlib.h> for C99+
          # which disallows implicit function declarations (malloc/free/realloc)
          for f in regparse.c reggnu.c; do
            if [ -f "$f" ] && ! grep -q '#include <stdlib.h>' "$f"; then
              echo "Adding #include <stdlib.h> to $f"
              echo '#include <stdlib.h>' | cat - "$f" > "$f.tmp" && mv "$f.tmp" "$f"
            fi
          done
          # Create config.h for Oniguruma (normally generated by configure)
          if [ ! -f config.h ]; then
            echo '#ifndef ONIG_CONFIG_H' > config.h
            echo '#define ONIG_CONFIG_H' >> config.h
            echo '#define SIZEOF_INT 4' >> config.h
            echo '#define SIZEOF_SHORT 2' >> config.h
            echo '#define SIZEOF_LONG 8' >> config.h
            echo '#define SIZEOF_VOIDP 8' >> config.h
            echo '#define SIZEOF_LONG_LONG 8' >> config.h
            echo '#define SIZEOF_SIZE_T 8' >> config.h
            echo '#define SIZEOF_OFF_T 8' >> config.h
            echo '#define HAVE_STDARG_H 1' >> config.h
            echo '#define HAVE_STDLIB_H 1' >> config.h
            echo '#define HAVE_STRING_H 1' >> config.h
            echo '#define HAVE_MEMORY_H 1' >> config.h
            echo '#define HAVE_SYS_TYPES_H 1' >> config.h
            echo '#define HAVE_STDINT_H 1' >> config.h
            echo '#define HAVE_INTTYPES_H 1' >> config.h
            echo '#define HAVE_UNISTD_H 1' >> config.h
            echo '#define HAVE_SYS_STAT_H 1' >> config.h
            echo '#define HAVE_ALLOCA_H 1' >> config.h
            echo '#define HAVE_ALLOCA 1' >> config.h
            echo '#define HAVE_STRINGIZE 1' >> config.h
            echo '#endif' >> config.h
            echo "Created config.h for Oniguruma"
          fi

      - name: Install xcodeproj gem
        run: gem install xcodeproj

      - name: Add source files to Xcode project
        run: |
          ruby scripts/add_sources.rb \
            build/Kirikiroid2/proj.ios_mac/Kirikiroid2.xcodeproj \
            build/Kirikiroid2/Classes/

      - name: Configure Xcode build settings
        run: |
          ruby scripts/configure_xcode.rb \
            build/Kirikiroid2/proj.ios_mac/Kirikiroid2.xcodeproj

      - name: Build IPA (unsigned)
        run: |
          cd build/Kirikiroid2/proj.ios_mac
          echo "=== Available schemes ==="
          xcodebuild -project Kirikiroid2.xcodeproj -list 2>&1 || true
          echo "=== Available targets ==="
          xcodebuild -project Kirikiroid2.xcodeproj -targets 2>&1 || true
          echo "=== Checking SDK ==="
          xcodebuild -showBuildSettings -sdk iphoneos 2>&1 | head -20 || true
          SCHEME="Kirikiroid2 iOS"
          echo "Using scheme: $SCHEME"
          set +e
          xcodebuild \
            -project Kirikiroid2.xcodeproj \
            -scheme "$SCHEME" \
            -sdk iphoneos \
            -configuration Release \
            build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY='' \
            ENABLE_BITCODE=NO \
            IPHONEOS_DEPLOYMENT_TARGET=12.0 \
            2>&1 | tee xcodebuild.log
          BUILD_EXIT=${PIPESTATUS[0]}
          set -e
          echo "Build exit code: $BUILD_EXIT"
          if [ $BUILD_EXIT -ne 0 ]; then
            {
              echo "## Build Errors"
              echo '```'
              grep -E "error:|fatal:|scheme|not found|does not exist" xcodebuild.log | head -80 || echo "No error lines found"
              echo '```'
              echo "## Last 100 lines"
              echo '```'
              tail -100 xcodebuild.log
              echo '```'
            } >> $GITHUB_STEP_SUMMARY
          fi
          exit $BUILD_EXIT

      - name: Save build error info
        if: failure()
        run: |
          cd build/Kirikiroid2/proj.ios_mac
          ERROR_FILE="$GITHUB_WORKSPACE/build_errors.txt"
          {
            echo "=== BUILD ERROR INFO ==="
            echo "Date: $(date)"
            echo "Run: $GITHUB_RUN_NUMBER"
            echo ""
            grep -E "error:|fatal:|scheme|not found|does not exist" xcodebuild.log | head -80 || echo "No error lines found"
            echo ""
            echo "=== LAST 150 LINES ==="
            tail -150 xcodebuild.log
          } > "$ERROR_FILE"
          cat "$ERROR_FILE"
          cd "$GITHUB_WORKSPACE"
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add build_errors.txt
          git commit -m "auto: update build_errors.txt from run #$GITHUB_RUN_NUMBER" || true
          git push origin trae || true

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: build/Kirikiroid2/proj.ios_mac/xcodebuild.log
          retention-days: 5

      - name: Package IPA
        run: |
          BUILD_APP=$(find build/Kirikiroid2 -name "*.app" -type d 2>/dev/null | head -1)
          if [ -z "$BUILD_APP" ]; then
            BUILD_APP=$(find ~/Library/Developer/Xcode/DerivedData -name "*.app" -type d 2>/dev/null | head -1)
          fi
          if [ -n "$BUILD_APP" ]; then
            mkdir -p Payload
            cp -r "$BUILD_APP" Payload/
            zip -r Kirikiroid2.ipa Payload/
            echo "IPA created from: $BUILD_APP"
            ls -la Kirikiroid2.ipa
          else
            echo "ERROR: No .app found anywhere"
            find build/Kirikiroid2 -name "*.app" -type d 2>/dev/null || true
            find ~/Library/Developer/Xcode/DerivedData -name "*.app" -type d 2>/dev/null || true
            exit 1
          fi

      - name: Upload Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: "ios-build-${{ github.sha }}"
          files: Kirikiroid2.ipa
          name: "Kirikiroid2 iOS Build"
          body: |
            iOS build with popup crash fix

            Changes:
            - Added iOS native popup implementation (UIAlertController)
            - Fixed memory management for ARC compatibility
            - Added thread safety for UI operations
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
