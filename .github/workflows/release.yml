name: Build and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  ios-build:
    name: "Build iOS IPA"
    runs-on: "macos-13"
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract version
        id: extract_version
        run: |
          TAG_NAME=$(echo "${{ github.ref }}" | sed 's/refs\/tags\///')
          echo "::set-output name=version::${TAG_NAME}"

      - name: Install dependencies
        run: |
          brew install pyenv cmake ninja pkg-config

      - name: Setup Python 2.7
        run: |
          echo 'export PYENV_ROOT="$HOME/.pyenv"' >> ~/.bash_profile
          echo 'export PATH="$PYENV_ROOT/bin:$PATH"' >> ~/.bash_profile
          echo 'eval "$(pyenv init --path)"' >> ~/.bash_profile
          echo 'eval "$(pyenv init -)"' >> ~/.bash_profile
          source ~/.bash_profile
          pyenv install 2.7.18
          pyenv global 2.7.18
          python --version

      - name: Setup cocos2d-x
        run: |
          mkdir -p vendor
          cd vendor
          git clone --depth=1 --branch=cocos2d-x-3.6 https://github.com/cocos2d/cocos2d-x.git
          cd cocos2d-x
          python download-deps.py -a no
          git submodule update --init
          cd ..
          ln -sf cocos2d-x current
          cd ../..

      - name: Create iOS project
        run: |
          python vendor/cocos2d-x/tools/cocos2d-console/bin/cocos new Kirikiroid2 -p org.tvp.kirikiri2 -l cpp -d ios

      - name: Copy source files
        run: |
          cp -r src/core/environ/ios/iOSUtils.cpp ios/Kirikiroid2/Classes/
          cp src/core/environ/ui/MessageBox.cpp ios/Kirikiroid2/Classes/
          cp src/core/environ/ui/BaseForm.cpp ios/Kirikiroid2/Classes/
          cp src/core/environ/cocos2d/MainScene.cpp ios/Kirikiroid2/Classes/
          cp src/core/environ/cocos2d/AppDelegate.cpp ios/Kirikiroid2/Classes/
          cp src/core/environ/cocos2d/CustomFileUtils.cpp ios/Kirikiroid2/Classes/

      - name: Copy header files
        run: |
          mkdir -p ios/Kirikiroid2/Classes/environ/ios
          mkdir -p ios/Kirikiroid2/Classes/environ/ui
          mkdir -p ios/Kirikiroid2/Classes/environ/cocos2d
          mkdir -p ios/Kirikiroid2/Classes/base
          mkdir -p ios/Kirikiroid2/Classes/tjs2
          cp -r src/core/environ/ ios/Kirikiroid2/Classes/environ/
          cp -r src/core/base/ ios/Kirikiroid2/Classes/base/
          cp -r src/core/tjs2/*.h ios/Kirikiroid2/Classes/tjs2/

      - name: Copy resources
        run: |
          cp -r cocos/kr2/Resources/* ios/Kirikiroid2/Resources/
          cp -r cocos/kr2/cocosstudio/* ios/Kirikiroid2/Resources/

      - name: Build cocos2d-x libraries
        run: |
          cd vendor/cocos2d-x
          python tools/cocos2d-console/bin/cocos gen-libs -p ios -m release

      - name: Build IPA
        run: |
          cd ios/Kirikiroid2
          xcodebuild -workspace Kirikiroid2.xcworkspace -scheme Kirikiroid2 -configuration Release -destination generic/platform=iOS -archivePath build/Kirikiroid2.xcarchive archive 2>&1 | tail -50

      - name: Export IPA
        run: |
          cd ios/Kirikiroid2
          cat > ExportOptions.plist << 'EOF'
<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
<plist version="1.0">
<dict>
  <key>method</key>
  <string>development</string>
  <key>compileBitcode</key>
  <false/>
  <key>stripSwiftSymbols</key>
  <false/>
</dict>
</plist>
EOF
          xcodebuild -exportArchive -archivePath build/Kirikiroid2.xcarchive -exportPath build -exportOptionsPlist ExportOptions.plist

      - name: Rename IPA
        run: |
          mv ios/Kirikiroid2/build/Kirikiroid2.ipa ios/Kirikiroid2/build/Kirikiroid2_${{ steps.extract_version.outputs.version }}_ios.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios_build
          path: ios/Kirikiroid2/build/Kirikiroid2_*.ipa

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref }}
          files: ios/Kirikiroid2/build/Kirikiroid2_*.ipa
          name: Kirikiroid2 ${{ steps.extract_version.outputs.version }}
          body: |
            ## iOS Build

            - Fixed iOS popup crash issue by adding proper UIAlertController implementation
            - Added thread safety by routing UI calls to main thread
            - Fixed memory management issues with ARC compatibility
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}